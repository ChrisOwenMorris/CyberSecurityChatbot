name: C# CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x' # Or your target .NET version
    - name: Restore dependencies
      run: dotnet restore CybersecurityChatbot.csproj
    - name: Build
      run: dotnet build --no-restore CybersecurityChatbot.csproj -c Release
